<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR - Handwritten Text Recognition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2rem; margin-bottom: 8px; color: #64ffda; }
        .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 0.9rem; }
        .mode-switch {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 20px;
        }
        .mode-switch a {
            padding: 8px 20px; border-radius: 20px; text-decoration: none;
            font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
        }
        .mode-switch a.active { background: #64ffda; color: #1a1a2e; }
        .mode-switch a:not(.active) { background: #2a2a4a; color: #aaa; }
        .mode-switch a:hover:not(.active) { background: #3a3a5a; color: #fff; }
        .canvas-container {
            background: #0a0a1a; border: 2px solid #333; border-radius: 12px;
            padding: 16px; margin-bottom: 20px; text-align: center;
        }
        canvas {
            background: #000; border-radius: 8px; cursor: crosshair;
            width: 100%; max-width: 800px; height: 150px;
            touch-action: none;
        }
        .hint { color: #666; font-size: 0.8rem; margin-top: 8px; }
        .buttons {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 20px;
        }
        .btn {
            padding: 12px 28px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-predict { background: #64ffda; color: #1a1a2e; }
        .btn-predict:hover { background: #4fd1b0; transform: translateY(-2px); }
        .btn-clear { background: #ff4757; color: #fff; }
        .btn-clear:hover { background: #e63946; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .result-box {
            background: #1e1e3a; border: 1px solid #333; border-radius: 12px;
            padding: 24px; text-align: center;
        }
        .result-label { color: #888; font-size: 0.85rem; margin-bottom: 8px; }
        .result-text {
            font-size: 2rem; font-weight: 700; color: #64ffda;
            min-height: 50px; direction: auto; /* handles RTL for Arabic */
        }
        .result-confidence { color: #888; margin-top: 8px; font-size: 0.9rem; }
        .status { text-align: center; margin-top: 12px; color: #666; font-size: 0.8rem; }
        .error { color: #ff4757; }
        .loading { color: #ffa502; }
        @media (max-width: 600px) {
            canvas { height: 120px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✍️ OCR — Handwritten Text Recognition</h1>
        <p class="subtitle">Draw a word or sentence — the AI reads it (English + Arabic + Digits)</p>

        <div class="mode-switch">
            <a href="/">Digit Mode</a>
            <a href="/ocr" class="active">OCR Mode</a>
        </div>

        <div class="canvas-container">
            <canvas id="canvas" width="800" height="150"></canvas>
            <p class="hint">Write text from left to right (English) or right to left (Arabic)</p>
        </div>

        <div class="buttons">
            <button class="btn btn-predict" id="predictBtn" onclick="predict()">Recognize Text</button>
            <button class="btn btn-clear" onclick="clearCanvas()">Clear</button>
        </div>

        <div class="result-box">
            <div class="result-label">Recognized Text</div>
            <div class="result-text" id="resultText">Draw something above...</div>
            <div class="result-confidence" id="resultConfidence"></div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Set up canvas
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Mouse events
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseout', stopDraw);

        // Touch events
        canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(getTouchPos(e)); });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(getTouchPos(e)); });
        canvas.addEventListener('touchend', stopDraw);

        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            return {
                offsetX: (touch.clientX - rect.left) * (canvas.width / rect.width),
                offsetY: (touch.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDraw(e) {
            isDrawing = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        }

        function draw(e) {
            if (!isDrawing) return;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            lastX = e.offsetX;
            lastY = e.offsetY;
        }

        function stopDraw() { isDrawing = false; }

        function clearCanvas() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('resultText').textContent = 'Draw something above...';
            document.getElementById('resultConfidence').textContent = '';
            document.getElementById('status').textContent = '';
        }

        async function predict() {
            const btn = document.getElementById('predictBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = 'Recognizing...';
            status.className = 'status loading';

            try {
                const imageData = canvas.toDataURL('image/png');
                const base64 = imageData.split(',')[1];

                const response = await fetch('/predict/ocr/base64', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64 })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Server error');
                }

                const data = await response.json();
                document.getElementById('resultText').textContent = data.text || '(empty)';
                document.getElementById('resultConfidence').textContent =
                    `Confidence: ${(data.confidence * 100).toFixed(1)}%`;
                status.textContent = '';
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                status.className = 'status error';
                document.getElementById('resultText').textContent = '—';
                document.getElementById('resultConfidence').textContent = '';
            }

            btn.disabled = false;
        }
    </script>
</body>
</html>
